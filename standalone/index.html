<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palo Alto Networks防火墙监控运维数字员工</title>
<style>
  :root {
    --bg:#f3f5f9; --bg2:#eef1f6; --card:#ffffff; --card2:#f7f9fc;
    --border:#e2e8f0; --border2:#d3dbe7;
    --text:#1f2937; --muted:#5b6b82; --dim:#94a3b8;
    --accent:#1668dc; --accent-dim:#0b4ea8;
    --blue:#1668dc; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --panel-bg:#fbfcfe;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:
    radial-gradient(1200px 500px at 20% -10%, rgba(22,104,220,.06), transparent 60%),
    radial-gradient(1000px 500px at 90% -10%, rgba(14,165,233,.05), transparent 60%),
    var(--bg); color:var(--text); min-height:100vh; line-height:1.55; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  .topbar { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:16px;
    padding:12px 24px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),#0ea5e9); font-weight:800; font-size:18px; color:#fff;
    box-shadow:0 2px 14px rgba(22,104,220,.35); }
  .brand h1 { font-size:17px; font-weight:700; letter-spacing:.3px; }
  .brand .sub { font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; }
  .topbar .spacer { flex:1; }
  .top-ctrl { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .select { background:#fff; color:var(--text); border:1px solid var(--border2); border-radius:8px;
    padding:8px 12px; font-size:13px; outline:none; }
  .select:focus { border-color:var(--accent); }
  .btn { background:#fff; color:var(--text); border:1px solid var(--border2); border-radius:8px;
    padding:8px 14px; font-size:13px; cursor:pointer; transition:all .15s; }
  .btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(22,104,220,.06); }
  .btn:disabled { opacity:.45; cursor:wait; }
  .btn.primary { background:linear-gradient(135deg,var(--accent),#0ea5e9); border:none; color:#fff; font-weight:600; }
  .btn.primary:hover { filter:brightness(1.08); color:#fff; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px;
    font-size:12px; border:1px solid var(--border); color:var(--muted); background:#fff; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.green { background:var(--green); box-shadow:0 0 8px rgba(22,163,74,.6); }
  .dot.red { background:var(--red); box-shadow:0 0 8px rgba(220,38,38,.6); }
  .dot.amber { background:var(--amber); }
  .dot.gray { background:var(--dim); }

  .wrap { padding:20px 24px 40px; max-width:1480px; margin:0 auto; }

  /* KPI */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi { background:linear-gradient(160deg,#ffffff,#f7f9fc); border:1px solid var(--border);
    border-radius:14px; padding:14px 16px; position:relative; overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .kpi::before { content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,var(--accent),transparent); opacity:.8; }
  .kpi .label { font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .kpi .value { font-size:24px; font-weight:700; margin-top:6px; font-family:var(--mono); }
  .kpi .value small { font-size:13px; color:var(--muted); font-weight:400; }
  .kpi .extra { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .kpi .bar { height:4px; background:var(--border); border-radius:2px; margin-top:8px; overflow:hidden; }
  .kpi .bar > i { display:block; height:100%; border-radius:2px; background:var(--accent); }
  .kpi.warn::before { background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi.bad::before { background:linear-gradient(90deg,var(--red),transparent); }

  /* 命令中心 */
  .cmd { background:#fff; border:1px solid var(--border);
    border-radius:16px; padding:18px; margin-bottom:18px;
    box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .cmd-row { display:flex; gap:10px; align-items:stretch; }
  .cmd input { flex:1; background:var(--panel-bg); border:1px solid var(--border2); color:var(--text);
    border-radius:10px; padding:13px 16px; font-size:14.5px; outline:none; font-family:inherit; }
  .cmd input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(22,104,220,.12); }
  .cmd input::placeholder { color:var(--dim); }
  .cmd .btn { border-radius:10px; padding:0 22px; font-size:14px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip { padding:6px 14px; border-radius:20px; border:1px solid var(--border2); background:#fff;
    color:var(--muted); font-size:12.5px; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:var(--accent); color:var(--accent); background:rgba(22,104,220,.06); }
  .chip.danger:hover { border-color:var(--red); color:var(--red); background:rgba(220,38,38,.06); }

  /* 面板 */
  .panel { background:#fff; border:1px solid var(--border); border-radius:16px; margin-bottom:16px; overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .panel-head { display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border);
    background:var(--card2); }
  .panel-head h2 { font-size:14px; font-weight:600; flex:1; display:flex; align-items:center; gap:8px; }
  .panel-head .meta { font-size:11.5px; color:var(--muted); }
  .panel-body { padding:16px 18px; }

  /* 任务 */
  .task { border:1px solid var(--border); border-radius:12px; background:var(--panel-bg); margin-bottom:12px; overflow:hidden; }
  .task-head { display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); background:linear-gradient(180deg,#f8fafc,#ffffff); }
  .t-id { font-family:var(--mono); font-size:12px; color:var(--dim); }
  .t-input { font-size:13.5px; flex:1; min-width:200px; }
  .t-time { font-size:11px; color:var(--dim); font-family:var(--mono); }
  .st { display:inline-flex; align-items:center; gap:5px; padding:3px 12px; border-radius:14px; font-size:12px; font-weight:600; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .st.done { background:rgba(22,163,74,.1); color:#15803d; }
  .st.running,.st.executing,.st.committing { background:rgba(22,104,220,.1); color:#1d4ed8; }
  .st.awaiting_approval,.st.awaiting_commit { background:rgba(217,119,6,.1); color:#b45309; }
  .st.failed { background:rgba(220,38,38,.1); color:#b91c1c; }
  .st.cancelled { background:rgba(100,116,139,.12); color:var(--muted); }
  .st.pending { background:rgba(100,116,139,.12); color:var(--muted); }
  .task-body { padding:12px 16px; }
  .plan { background:rgba(217,119,6,.08); border:1px solid rgba(217,119,6,.28); border-radius:8px;
    padding:10px 12px; font-size:13px; color:#92400e; margin-bottom:10px; }
  .steps { font-size:12px; color:var(--muted); padding:2px 0; font-family:var(--mono); }
  .steps.ok { color:var(--green); }
  .steps.err { color:var(--red); }
  .steps.running { color:var(--blue); }
  .step-block { background:#f1f5f9; border-radius:8px; padding:8px 12px; margin-top:10px;
    border-left:2px solid var(--accent); }
  .err { color:var(--red); font-size:13px; }
  .empty { color:var(--dim); font-size:13px; padding:10px 0; }
  .grade { font-size:15px; font-weight:700; margin-bottom:8px; }
  .grade.bad { color:var(--red); } .grade.mid { color:var(--amber); } .grade.good { color:var(--green); }

  table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:7px 9px; border-bottom:1px solid var(--border);
    white-space:nowrap; font-size:11.5px; letter-spacing:.5px; }
  td { padding:7px 9px; border-bottom:1px solid var(--border); vertical-align:top; word-break:break-all; color:var(--text); }
  tr:hover td { background:rgba(15,23,42,.02); }
  .kv { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .tool-tag { display:inline-block; font-family:var(--mono); font-size:11px; background:rgba(22,104,220,.08);
    color:#1d4ed8; border:1px solid rgba(22,104,220,.22); padding:2px 9px; border-radius:6px; margin:4px 6px 0 0; }
  .trouble { display:none; margin-bottom:14px; padding:12px 16px; background:#fff; border:1px solid var(--border);
    border-radius:12px; font-size:12.5px; line-height:1.9; color:var(--muted); }
  .trouble b { color:var(--red); }
  .modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.4); backdrop-filter:blur(4px); z-index:999;
    display:flex; align-items:center; justify-content:center; }
  .modal-box { background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 26px;
    max-width:680px; width:92%; max-height:82vh; overflow:auto; box-shadow:0 24px 80px rgba(15,23,42,.25); }
  .modal-box h2 { font-size:16px; margin-bottom:14px; }
  .modal-box code { background:var(--panel-bg); padding:2px 7px; border-radius:5px; font-size:12px; color:var(--accent); }
  .foot { text-align:center; color:var(--dim); font-size:11px; padding:20px 0 10px; letter-spacing:1px; }
  @media (max-width:720px) { .topbar{padding:10px 14px} .wrap{padding:14px} .cmd-row{flex-direction:column} .cmd .btn{padding:12px} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">PA</div>
    <div>
      <h1>Palo Alto Networks防火墙监控运维数字员工</h1>
      <div class="sub">PAN-OS Security Operations Console</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="top-ctrl">
    <span class="pill"><span class="dot green" id="fsDot"></span><span id="fsTxt">飞书检测中</span></span>
    <select class="select" id="llmSel"></select>
    <button class="btn" onclick="showLLMConfig()">⚙️ 模型配置</button>
  </div>
</div>

<div class="wrap">

  <!-- KPI 监控 -->
  <div class="kpis">
    <div class="kpi" id="kpiDevice">
      <div class="label">🖥️ 设备</div>
      <div class="value">--</div>
      <div class="extra">--</div>
    </div>
    <div class="kpi" id="kpiHa">
      <div class="label">🔁 HA 高可用</div>
      <div class="value">--</div>
      <div class="extra">--</div>
    </div>
    <div class="kpi" id="kpiSession">
      <div class="label">🔗 活跃会话</div>
      <div class="value">--</div>
      <div class="bar"><i style="width:0%"></i></div>
      <div class="extra">--</div>
    </div>
    <div class="kpi" id="kpiResource">
      <div class="label">📊 负载 / 内存</div>
      <div class="value">--</div>
      <div class="extra">--</div>
    </div>
    <div class="kpi" id="kpiLicense">
      <div class="label">🪪 许可证</div>
      <div class="value">--</div>
      <div class="extra">--</div>
    </div>
  </div>

  <!-- 命令中心 -->
  <div class="cmd">
    <div class="cmd-row">
      <input id="q" placeholder="下达任务：设备状态 / 完整巡检 / 流量日志 / 谁在10分钟前修改了策略 / 192.168.1.2 不能访问外网 / 创建地址对象 x=10.0.0.0/24 / 封禁 1.2.3.4 …"
        onkeydown="if(event.key==='Enter')submit()">
      <button class="btn primary" id="submitBtn" onclick="submit()">执行任务</button>
      <select class="select" id="fwSel" style="display:none"></select>
    </div>
    <div class="chips" id="btns"></div>
    <div class="trouble" id="troublePanel"></div>
  </div>

  <div id="out"></div>

  <!-- 飞书集成 -->
  <div class="panel">
    <div class="panel-head">
      <h2>💬 飞书集成</h2>
      <span class="meta" id="feishuStatus">检测中...</span>
    </div>
    <div class="panel-body">
      <div class="cmd-row">
        <input id="feishuMsg" placeholder="输入要发送到飞书群的消息..." style="flex:1">
        <button class="btn" onclick="feishuSend()">发送</button>
        <button class="btn" onclick="feishuPushReport()">推送最新巡检报告</button>
      </div>
      <div id="feishuResult" class="empty"></div>
    </div>
  </div>

  <!-- 任务中心 -->
  <div class="panel">
    <div class="panel-head">
      <h2>🎯 任务中心</h2>
      <button class="btn" onclick="pollTasks()" style="padding:5px 12px">🔄 刷新</button>
    </div>
    <div class="panel-body" id="tasks"><div class="empty">暂无任务</div></div>
  </div>

  <div class="foot">Palo Alto Networks · PAN-OS 安全运维监控 · 数字员工平台</div>
</div>

<script>
let BTN_LABELS = {};

async function init() {
  try {
    const [acts, fws, llm] = await Promise.all([
      fetch("/api/actions").then(r => r.json()),
      fetch("/api/firewalls").then(r => r.json()),
      fetch("/api/llm").then(r => r.json())
    ]);
    BTN_LABELS = (acts && acts.actions) || {};
    renderQuickButtons();
    renderFirewallSelect(fws);
    renderLLMSelect(llm);
    pollTasks();
    loadOverview();
  } catch (e) {
    document.getElementById("tasks").innerHTML = '<div class="empty">后端未启动：' + esc(String(e && e.message || e)) + "</div>";
  }
}

function renderQuickButtons() {
  const btns = document.getElementById("btns");
  btns.innerHTML = "";
  const DEF = { inspect: "完整巡检", inventory: "设备清单", device: "设备状态", security: "安全策略", traffic: "流量日志", threat: "威胁日志", licenses: "许可证" };
  ["inspect", "inventory", "device", "security", "traffic", "threat", "licenses"].forEach(k => {
    if (!BTN_LABELS[k]) return;
    const b = document.createElement("button");
    b.className = "chip" + (k === "inspect" ? "" : "");
    b.textContent = BTN_LABELS[k] || DEF[k];
    b.onclick = () => { document.getElementById("q").value = BTN_LABELS[k] || DEF[k]; submit(); };
    btns.appendChild(b);
  });
  const tb = document.createElement("button");
  tb.className = "chip danger";
  tb.textContent = "🔧 排错";
  tb.onclick = toggleTrouble;
  btns.appendChild(tb);
}

function toggleTrouble() {
  const p = document.getElementById("troublePanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
  if (p.style.display === "block" && !p.innerHTML) {
    p.innerHTML = "<b>🔧 排错速查：</b><br>" +
      "· 流量/策略查询失败 → 检查 API key 与 MCP 进程<br>" +
      "· 任务卡住 → 30s 自动超时，可点取消；或提交「全面健康检查一下」诊断<br>" +
      "· 结果为空 → 20s 热缓存可能命中，稍后刷新重试<br>" +
      "· 后端日志：tail -f /tmp/webui.log · LLM 日志：curl localhost:8080/api/llm/log";
  }
}

function renderFirewallSelect(fws) {
  const sel = document.getElementById("fwSel");
  sel.innerHTML = "";
  (fws.firewalls || []).forEach(f => {
    const o = document.createElement("option");
    o.value = f.name;
    o.textContent = f.name + " (" + f.host + ")";
    sel.appendChild(o);
  });
  sel.style.display = fws.multi ? "" : "none";
}

function renderLLMSelect(llm) {
  const sel = document.getElementById("llmSel");
  sel.innerHTML = "";
  const opt = document.createElement("option");
  opt.value = "keyword";
  opt.textContent = "关键词模式（免费）";
  sel.appendChild(opt);
  Object.entries((llm && llm.providers) || {}).forEach(([k, v]) => {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = (v.model || v.label || k) + (v.configured ? "" : " · 未配置");
    sel.appendChild(o);
  });
  sel.value = llm ? llm.current : "keyword";
}

function currentFirewall() {
  const s = document.getElementById("fwSel");
  return s.style.display === "none" ? null : s.value;
}

/* ── KPI 概览 ── */
async function loadOverview() {
  try {
    const r = await fetch("/api/overview");
    const d = await r.json();
    const k = d.kpi || {};
    const dev = k.device || {}, ha = k.ha || {}, sess = k.session || {}, res = k.resource || {}, lic = k.license || {};
    const devEl = document.getElementById("kpiDevice");
    devEl.querySelector(".value").innerHTML = esc(dev.hostname || "--");
    devEl.querySelector(".extra").textContent = (dev.model || "") + " · " + (dev.sw || "") + (dev.uptime ? " · up " + esc(dev.uptime) : "");
    const haEl = document.getElementById("kpiHa");
    haEl.querySelector(".value").textContent = ha.enabled === undefined ? "--" : (ha.enabled ? "已启用" : "未启用");
    haEl.querySelector(".extra").textContent = "PA 高可用对";
    haEl.className = "kpi" + (ha.enabled === false ? " warn" : "");
    const sessEl = document.getElementById("kpiSession");
    const active = parseInt(sess.active || 0, 10), max = parseInt(sess.max || 0, 10);
    sessEl.querySelector(".value").innerHTML = active + (max ? " <small>/ " + max + "</small>" : "");
    const pct = max ? Math.min(100, Math.round(active / max * 100)) : 0;
    sessEl.querySelector(".bar i").style.width = pct + "%";
    sessEl.querySelector(".extra").textContent = (sess.kbps ? "kbps " + sess.kbps : "") + (sess.pps ? " · pps " + sess.pps : "");
    sessEl.className = "kpi" + (pct > 85 ? " bad" : pct > 65 ? " warn" : "");
    const resEl = document.getElementById("kpiResource");
    resEl.querySelector(".value").innerHTML = esc(res.load || "--");
    resEl.querySelector(".extra").textContent = res.memUsed ? "内存 " + esc(res.memUsed) + " / " + esc(res.memTotal || "?") : "";
    const licEl = document.getElementById("kpiLicense");
    licEl.querySelector(".value").innerHTML = lic.total === undefined ? "--" : String(lic.total);
    licEl.querySelector(".extra").textContent = lic.expired ? lic.expired + " 项已过期" : (lic.total ? "全部有效" : "");
    licEl.className = "kpi" + (lic.expired ? " warn" : "");
  } catch (e) {}
  setTimeout(loadOverview, 10000);
}

async function submit() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const out = document.getElementById("out");
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  try {
    const r = await fetch("/api/task", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q, firewall: currentFirewall() })
    });
    const d = await r.json();
    if (d.error) {
      out.innerHTML = '<div class="panel"><div class="panel-body"><div class="err">' + esc(d.error) + "</div></div></div>";
      setTimeout(() => { if (out.innerHTML.includes("err")) out.innerHTML = ""; }, 3000);
    } else if (d.status === "awaiting_approval") {
      out.innerHTML = '<div class="panel"><div class="panel-body"><div class="plan">⏳ 等待审批：' + esc(d.plan) + '</div>请在任务中心点击「批准」或「拒绝」</div></div>';
    } else {
      out.innerHTML = '<div class="panel"><div class="panel-body"><div class="empty">任务 #' + d.taskId + " 已提交，查看任务中心 ↓</div></div></div>";
      setTimeout(() => { if (out.innerHTML.includes("已提交")) out.innerHTML = ""; }, 1500);
    }
    pollTasks();
  } catch (e) {
    out.innerHTML = '<div class="panel"><div class="panel-body"><div class="err">' + esc(e.message || e) + "</div></div></div>";
  } finally {
    btn.disabled = false;
  }
}

async function selectLLM() {
  const provider = document.getElementById("llmSel").value;
  const r = await fetch("/api/llm/select", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ provider })
  });
  const d = await r.json();
  if (d.error) {
    const hint = d.hint || "";
    const body = '<div style="font-size:13px;line-height:1.9;white-space:pre-wrap">' + esc(d.error) + (hint ? "<br><br>" + esc(hint) : "") + "</div>";
    showModal("⚠️ LLM 未配置", body);
    document.getElementById("llmSel").value = "keyword";
  } else {
    pollTasks();
  }
}

function showModal(title, bodyHtml) {
  const m = document.createElement("div");
  m.className = "modal-mask";
  m.innerHTML = '<div class="modal-box"><h2>' + title + '</h2>' + bodyHtml +
    '<div style="text-align:right;margin-top:16px"><button class="btn" onclick="this.closest(\'.modal-mask\').remove()">关闭</button></div></div>';
  document.body.appendChild(m);
}

async function showLLMConfig() {
  try {
    const r = await fetch("/api/llm");
    const d = await r.json();
    const providers = d.providers || {};
    const cur = d.current;
    const STYLE = '<style>.cfg-input{padding:8px 10px;border:1px solid var(--border2);border-radius:6px;font-size:13px;background:var(--panel-bg);color:var(--text);width:100%;box-sizing:border-box}.cfg-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(22,104,220,.15)}table.llmtb{width:100%;border-collapse:collapse;table-layout:fixed}table.llmtb th{font-size:11.5px;letter-spacing:.5px;padding:8px 6px;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}table.llmtb td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}.llm-add input{width:auto;min-width:140px}</style>';
    let html = STYLE +
      '<div style="font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.7">修改后立即生效（写入 llm-config.json，进程内同步 env）。<br>当前使用：<b style="color:var(--accent);font-size:14px">' + esc(cur) + "</b></div>";
    html += '<table class="llmtb"><colgroup><col style="width:130px"><col style="width:200px"><col style="width:300px"><col style="width:220px"><col style="width:150px"></colgroup>';
    html += "<thead><tr><th>提供方</th><th>模型</th><th>Base URL</th><th>Key</th><th>操作</th></tr></thead><tbody>";
    for (const [k, v] of Object.entries(providers)) {
      html += '<tr id="llmRow_' + k + '">' +
        '<td><input class="cfg-input" id="cfg_label_' + k + '" value="' + esc(v.label || k) + '"></td>' +
        '<td><input class="cfg-input" id="cfg_model_' + k + '" value="' + esc(v.model) + '"></td>' +
        '<td><input class="cfg-input" id="cfg_base_' + k + '" value="' + esc(v.base_url) + '"></td>' +
        '<td><input class="cfg-input" type="password" id="cfg_key_' + k + '" placeholder="' + (v.configured ? esc(v.key_hint) + "（已配置，留空保留）" : "输入 API Key") + '"></td>' +
        '<td style="white-space:nowrap"><button class="btn primary" onclick="saveLLM(\'' + k + '\')">保存</button> <button class="btn" onclick="delLLM(\'' + k + '\')">删除</button></td>' +
        '</tr>';
    }
    html += "</tbody></table>";
    html += '<div class="llm-add" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border)"><b style="display:block;margin-bottom:10px">➕ 新增提供方</b>' +
      '<input class="cfg-input" id="cfg_new_id" placeholder="provider id（小写字母数字下划线）"> ' +
      '<input class="cfg-input" id="cfg_new_label" placeholder="显示名"> ' +
      '<input class="cfg-input" id="cfg_new_url" placeholder="https://api.example.com/v1"> ' +
      '<input class="cfg-input" id="cfg_new_model" placeholder="model name"> ' +
      '<input class="cfg-input" type="password" id="cfg_new_key" placeholder="API Key"> ' +
      '<button class="btn primary" onclick="addLLM()" style="margin-left:6px">添加</button></div>';
    // 用更大的 modal（覆盖默认 .modal-box 的 max-width:680px）
    const m = document.createElement("div");
    m.className = "modal-mask";
    m.innerHTML = '<div class="modal-box" style="max-width:1080px;width:96%"><h2>⚙️ 模型配置（运行时编辑）</h2>' + html +
      '<div style="text-align:right;margin-top:18px"><button class="btn" onclick="this.closest(\'.modal-mask\').remove()">关闭</button></div></div>';
    document.body.appendChild(m);
  } catch (e) { showModal("错误", esc(e.message)); }
}

async function saveLLM(provider) {
  const body = {
    provider,
    label: document.getElementById("cfg_label_" + provider).value.trim(),
    base_url: document.getElementById("cfg_base_" + provider).value.trim(),
    model: document.getElementById("cfg_model_" + provider).value.trim(),
    key: document.getElementById("cfg_key_" + provider).value.trim(),
  };
  try {
    const r = await fetch("/api/llm/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.error) { alert("保存失败：" + d.error); return; }
    document.getElementById("cfg_key_" + provider).value = "";
    document.getElementById("cfg_key_" + provider).placeholder = d.configured ? "已配置" : "未配置";
    alert("✅ 已保存 " + provider);
    await refreshLLMSel();
  } catch (e) { alert("错误：" + e.message); }
}

async function addLLM() {
  const id = document.getElementById("cfg_new_id").value.trim();
  if (!id) return alert("请输入 provider id");
  const body = {
    provider: id,
    label: document.getElementById("cfg_new_label").value.trim() || id,
    base_url: document.getElementById("cfg_new_url").value.trim(),
    model: document.getElementById("cfg_new_model").value.trim(),
    key: document.getElementById("cfg_new_key").value.trim(),
  };
  try {
    const r = await fetch("/api/llm/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.error) { alert("添加失败：" + d.error); return; }
    alert("✅ 已添加 " + id);
    document.querySelector(".modal-mask").remove();
    showLLMConfig();
  } catch (e) { alert("错误：" + e.message); }
}

async function delLLM(provider) {
  if (!confirm("删除 " + provider + " 配置？")) return;
  try {
    await fetch("/api/llm/config/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider }) });
    alert("✅ 已删除 " + provider);
    document.querySelector(".modal-mask").remove();
    showLLMConfig();
  } catch (e) { alert("错误：" + e.message); }
}

async function refreshLLMSel() {
  try {
    const r = await fetch("/api/llm");
    const d = await r.json();
    renderLLMSelect(d);
  } catch (e) {}
}

async function pollTasks() {
  try {
    const r = await fetch("/api/tasks");
    const d = await r.json();
    const tasks = d.tasks || [];
    const box = document.getElementById("tasks");
    if (!tasks.length) { box.innerHTML = '<div class="empty">暂无任务 · 从上方命令中心下达第一个任务</div>'; return; }
    box.innerHTML = tasks.slice(0, 20).map(renderTask).join("");
    const active = tasks.some(t => ["pending", "running", "executing", "committing"].includes(t.status));
    if (active) setTimeout(pollTasks, 3000);
  } catch (e) { document.getElementById("tasks").innerHTML = '<div class="empty">任务列表加载失败</div>'; }
}

function renderTask(t) {
  let h = '<div class="task"><div class="task-head"><span class="t-id">#' + t.id + '</span><span class="st ' + t.status + '">' + statusText(t.status) + '</span><span class="t-input">' + esc(t.input) + '</span><span class="t-time">' + esc(t.createdAt || "") + "</span></div>";
  h += '<div class="task-body">';

  if (t.status === "awaiting_approval") {
    h += '<div class="plan">变更计划：' + esc(t.plan) + "</div>";
    h += '<button class="btn" style="background:var(--green);color:#04121a;border:none" onclick="act(' + t.id + ",'approve')\">批准执行</button> <button class='btn' style='background:var(--red);color:#fff;border-color:var(--red)' onclick=\"act(" + t.id + ",'reject')\">拒绝</button>";
  } else if (t.status === "awaiting_commit") {
    h += '<div class="plan">candidate 已就绪，确认 commit？</div>';
    h += '<button class="btn" style="background:var(--green);color:#04121a;border:none" onclick="act(' + t.id + ",'confirm')\">确认 commit</button> <button class='btn' onclick=\"act(" + t.id + ",'cancel')\">取消</button>";
  } else if (["pending", "running", "executing", "committing"].includes(t.status)) {
    h += '<button class="btn" style="float:right" onclick="act(' + t.id + ",'cancel')\">取消任务</button>";
  }

  if (t.status === "done" && t.type === "query" && t.result) {
    h += renderResult(t.result.results);
  } else if (t.status === "done" && t.type === "inspect" && t.result) {
    h += '<div class="grade ' + (t.result.rate >= 75 ? (t.result.rate >= 90 ? "good" : "mid") : "bad") + '">评级 ' + esc(t.result.grade) + "（" + t.result.rate + "%）</div>";
    h += '<table><tr><th>检查项</th><th>结果</th></tr>' + (t.result.checks || []).map(c => "<tr><td>" + esc(c.name) + "</td><td>" + (c.pass ? "✅ 通过" : "❌ 不通过") + "</td></tr>").join("") + "</table>";
  } else if (t.status === "done" && t.type === "audit" && t.result) {
    h += '<div class="grade" style="font-size:14px">' + esc(t.result.title || "配置变更审计") + " · 共 " + t.result.total + " 条</div>";
    if (t.result.rows && t.result.rows.length) {
      h += "<table><tr><th>时间</th><th>操作人</th><th>命令</th><th>结果</th><th>来源</th><th>路径</th></tr>" +
        t.result.rows.slice(0, 50).map(r => "<tr><td>" + esc(r.time) + "</td><td>" + esc(r.admin) + "</td><td>" + esc(r.cmd) + "</td><td>" + esc(r.result) + "</td><td>" + esc(r.client) + "</td><td style='font-size:11px'>" + esc(r.path) + "</td></tr>").join("") +
        "</table>";
    } else {
      h += '<div class="empty">该时间窗口内无符合条件的变更记录</div>';
    }
  } else if (t.status === "done" && t.type === "diag" && t.result) {
    h += '<div class="grade" style="font-size:14px">' + esc(t.result.title || "诊断报告") + "</div>";
    if (t.result.verdict) h += '<div class="plan">' + esc(t.result.verdict) + "（置信度 " + esc(t.result.confidence || "-") + "）</div>";
    h += "<table><tr><th>排查步骤</th><th>结果</th></tr>" + (t.result.sections || []).map(s => "<tr><td>" + esc(s.step) + "</td><td>" + esc(s.result) + "</td></tr>").join("") + "</table>";
  } else if (t.status === "done" && t.type === "change" && t.result) {
    h += '<div class="steps ok">✅ ' + esc(t.result.detail || "变更完成") + "</div>";
  } else if (t.status === "failed") {
    h += '<div class="err">' + esc(t.error || "失败") + "</div>";
  }

  if (t.steps && t.steps.length) {
    const stepHtml = t.steps.map(s => {
      if (typeof s === "string") return '<div class="steps">· ' + esc(s) + "</div>";
      const icon = s.status === "running" ? "⏳" : s.status === "ok" ? "✅" : s.status === "err" ? "❌" : "·";
      const cls = s.status === "ok" ? "ok" : s.status === "err" ? "err" : s.status === "running" ? "running" : "";
      return '<div class="steps ' + cls + '">' + icon + " " + esc(s.tool || "") + (s.ms ? " (" + s.ms + "ms)" : "") + (s.msg ? " — " + esc(s.msg) : "") + "</div>";
    }).join("");
    h += '<div class="step-block">' + stepHtml + "</div>";
  }
  return h + "</div></div>";
}

function statusText(s) {
  const m = { pending: "排队中", running: "执行中", executing: "执行中", committing: "提交中", awaiting_approval: "待审批", awaiting_commit: "待确认", done: "完成", failed: "失败", cancelled: "已取消" };
  return m[s] || s;
}

async function act(id, action) {
  try { await fetch("/api/task/" + id + "/" + action, { method: "POST" }); } catch (e) {}
  pollTasks();
}

function renderResult(results) {
  let h = "";
  (results || []).forEach(res => {
    h += '<div class="tool-tag">' + esc(res.tool) + "</div>";
    if (res.error) { h += '<div class="err">' + esc(res.error) + "</div>"; return; }
    h += renderData(res.data);
  });
  return h;
}

function renderData(d) {
  if (d == null) return '<div class="empty">无数据</div>';
  if (typeof d === "string") return '<div class="kv">' + esc(d.slice(0, 600)) + "</div>";
  const arr = findArray(d);
  if (arr && arr.length > 0) return renderTable(arr);
  if (arr && arr.length === 0) return '<div class="empty">无数据（0 条）</div>';
  const flat = flattenObj(d);
  if (Object.keys(flat).length === 0) return '<div class="empty">无数据</div>';
  return renderKv(flat);
}

function findArray(o, depth) {
  depth = depth || 0;
  if (depth > 5) return null;
  if (Array.isArray(o)) return o;
  if (o && typeof o === "object") {
    for (const k of ["entry", "rules", "firewalls", "licenses"]) if (Array.isArray(o[k])) return o[k];
    for (const v of Object.values(o)) { const r = findArray(v, depth + 1); if (r && r.length) return r; }
  }
  return null;
}

function flattenObj(o, prefix, out) {
  prefix = prefix || "";
  out = out || {};
  for (const [k, v] of Object.entries(o || {})) {
    if (v == null || v === "") continue;
    if (typeof v === "object") flattenObj(v, prefix + k + ".", out);
    else out[prefix + k] = String(v);
  }
  return out;
}

function renderTable(rows) {
  let keys = [];
  rows.forEach(r => Object.keys(flattenObj(r)).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  if (keys.length > 12) {
    const PRIORITY = ["receive_time","time","time_generated","create_time","high_res_timestamp","src","source","src_ip","sport","dport","dst","destination","dst_ip","app","application","proto","rule","action","severity","threat","threatid","subtype","category","from","to","inbound_if","outbound_if","name","@_name","hostname","model","sw-version","family","kbps","num-active","num-tcp","num-udp","num-installed","num-max","pps","eventid","opaque","serial","ip-address","uptime","rule_uuid","ip","value","type","status","enabled"];
    const ranked = PRIORITY.filter(k => keys.includes(k));
    const rest = keys.filter(k => !PRIORITY.includes(k)).slice(0, 8);
    keys = ranked.concat(rest).slice(0, 14);
  }
  let h = "<table><tr>" + keys.map(k => "<th>" + esc(k) + "</th>").join("") + "</tr>";
  rows.slice(0, 50).forEach(r => {
    const flat = flattenObj(r);
    h += "<tr>" + keys.map(k => "<td>" + esc(flat[k] || "") + "</td>").join("") + "</tr>";
  });
  return h + "</table>" + (rows.length > 50 ? '<div class="empty">仅显示前 50 条 / 共 ' + rows.length + " 条</div>" : "");
}

function renderKv(kv) {
  let h = "<table>";
  Object.entries(kv).forEach(([k, v]) => {
    const sv = String(v);
    if (k === "raw" && sv.length > 200) {
      h += "<tr><th>raw</th><td class='kv'>[折叠 " + Math.round(sv.length / 1024) + "KB 原始数据]</td></tr>";
    } else {
      h += "<tr><th>" + esc(k) + "</th><td class='kv'>" + esc(sv.length > 300 ? sv.slice(0, 300) + "..." : sv) + "</td></tr>";
    }
  });
  return h + "</table>";
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

async function loadFeishuStatus() {
  try {
    const r = await fetch("/api/feishu/status");
    const d = await r.json();
    const dot = document.getElementById("fsDot");
    dot.className = "dot " + (d.running ? "green" : "red");
    document.getElementById("fsTxt").textContent = d.running ? "飞书在线" : "飞书离线";
    document.getElementById("feishuStatus").textContent = (d.running ? "🟢 轮询 daemon 运行中" : "🔴 轮询 daemon 未运行") + " · 群: " + esc(d.chat || "-");
  } catch (e) {}
}

async function feishuSend() {
  const text = document.getElementById("feishuMsg").value.trim();
  if (!text) return;
  const out = document.getElementById("feishuResult");
  out.innerHTML = "发送中...";
  try {
    const r = await fetch("/api/feishu/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    const d = await r.json();
    out.innerHTML = d.ok ? '<span style="color:var(--green)">✅ 已发送' + (d.data ? " (msg " + esc(d.data) + ")" : "") + "</span>" : '<span class="err">❌ ' + esc(d.error || "发送失败") + "</span>";
  } catch (e) { out.innerHTML = '<span class="err">❌ ' + esc(e.message) + "</span>"; }
}

async function feishuPushReport() {
  const out = document.getElementById("feishuResult");
  out.innerHTML = "推送中...";
  try {
    const r = await fetch("/api/feishu/push-report", { method: "POST" });
    const d = await r.json();
    out.innerHTML = d.ok ? '<span style="color:var(--green)">✅ 已推送最新报告</span>' : '<span class="err">❌ ' + esc(d.error || "推送失败") + "</span>";
  } catch (e) { out.innerHTML = '<span class="err">❌ ' + esc(e.message) + "</span>"; }
}

loadFeishuStatus();
init();
</script>
