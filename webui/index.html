<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Palo Alto Networks防火墙监控运维数字员工</title>
<style>
  :root {
    --bg:#f3f5f9; --bg2:#eef1f6; --card:#ffffff; --card2:#f7f9fc;
    --border:#e2e8f0; --border2:#d3dbe7;
    --text:#1f2937; --muted:#5b6b82; --dim:#94a3b8;
    --accent:#1668dc; --accent-dim:#0b4ea8;
    --blue:#1668dc; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --panel-bg:#fbfcfe;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:
    radial-gradient(1200px 500px at 20% -10%, rgba(22,104,220,.06), transparent 60%),
    radial-gradient(1000px 500px at 90% -10%, rgba(14,165,233,.05), transparent 60%),
    var(--bg); color:var(--text); min-height:100vh; line-height:1.55; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  .topbar { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:16px;
    padding:12px 24px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:44px; height:44px; border-radius:12px; object-fit:cover;
    box-shadow:0 2px 14px rgba(22,104,220,.28); background:transparent; }
  .brand h1 { font-size:24px; font-weight:800; color:#0a0a0a; letter-spacing:.3px; }
  .brand .sub { font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; }
  .topbar .spacer { flex:1; }
  .top-ctrl { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .select { background:#fff; color:var(--text); border:1px solid var(--border2); border-radius:8px;
    padding:8px 12px; font-size:13px; outline:none; }
  .select:focus { border-color:var(--accent); }
  .btn { background:#fff; color:var(--text); border:1px solid var(--border2); border-radius:8px;
    padding:8px 14px; font-size:13px; cursor:pointer; transition:all .15s; }
  .btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(22,104,220,.06); }
  .btn:disabled { opacity:.45; cursor:wait; }
  .btn.primary { background:linear-gradient(135deg,var(--accent),#0ea5e9); border:none; color:#fff; font-weight:600; }
  .btn.primary:hover { filter:brightness(1.08); color:#fff; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px;
    font-size:12px; border:1px solid var(--border); color:var(--muted); background:#fff; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.green { background:var(--green); box-shadow:0 0 8px rgba(22,163,74,.6); }
  .dot.red { background:var(--red); box-shadow:0 0 8px rgba(220,38,38,.6); }
  .dot.amber { background:var(--amber); }
  .dot.gray { background:var(--dim); }

  .wrap { padding:20px 24px 40px; max-width:1480px; margin:0 auto; }

  /* KPI */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi { background:linear-gradient(160deg,#ffffff,#f7f9fc); border:1px solid var(--border);
    border-radius:14px; padding:14px 16px; position:relative; overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .kpi::before { content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,var(--accent),transparent); opacity:.8; }
  .kpi .label { font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .kpi .value { font-size:24px; font-weight:700; margin-top:6px; font-family:var(--mono); }
  .kpi .value small { font-size:13px; color:var(--muted); font-weight:400; }
  .kpi .extra { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .kpi .bar { height:4px; background:var(--border); border-radius:2px; margin-top:8px; overflow:hidden; }
  .kpi .bar > i { display:block; height:100%; border-radius:2px; background:var(--accent); }
  .kpi.warn::before { background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi.bad::before { background:linear-gradient(90deg,var(--red),transparent); }

  /* 命令中心 */
  .cmd { background:#fff; border:1px solid var(--border);
    border-radius:16px; padding:18px; margin-bottom:18px;
    box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .cmd-row { display:flex; gap:10px; align-items:stretch; }
  .cmd-box { border:1px solid var(--border2); border-radius:12px; padding:10px 12px 8px; background:#fafbfc; transition:border-color .15s; }
  .cmd-box:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px rgba(22,104,220,.12); }
  .cmd-box textarea { width:100%; border:none; outline:none; resize:vertical; min-height:90px; max-height:260px;
    background:transparent; font:inherit; font-size:15px; color:var(--text); line-height:1.6; padding:4px 0; }
  .cmd-box-foot { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:6px; }
  .cmd-box-foot .select { font-size:12px; padding:5px 10px; }
  .cmd-box-foot .btn { border-radius:10px; padding:7px 16px; font-size:13px; }
  .cmd input { flex:1; background:var(--panel-bg); border:1px solid var(--border2); color:var(--text);
    border-radius:10px; padding:13px 16px; font-size:14.5px; outline:none; font-family:inherit; }
  .cmd input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(22,104,220,.12); }
  .cmd input::placeholder { color:var(--dim); }
  .cmd .btn { border-radius:10px; padding:0 22px; font-size:14px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip { padding:6px 14px; border-radius:20px; border:1px solid var(--border2); background:#fff;
    color:var(--muted); font-size:12.5px; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:var(--accent); color:var(--accent); background:rgba(22,104,220,.06); }
  .chip.danger:hover { border-color:var(--red); color:var(--red); background:rgba(220,38,38,.06); }

  /* 面板 */
  .panel { background:#fff; border:1px solid var(--border); border-radius:16px; margin-bottom:16px; overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .panel-head { display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border);
    background:var(--card2); }
  .panel-head h2 { font-size:14px; font-weight:600; flex:1; display:flex; align-items:center; gap:8px; }
  .panel-head .meta { font-size:11.5px; color:var(--muted); }
  .panel-body { padding:16px 18px; }

  /* 任务 */
  .task { border:1px solid var(--border); border-radius:12px; background:var(--panel-bg); margin-bottom:12px; overflow:hidden; }
  .task.live { border-color:rgba(22,104,220,.5); box-shadow:0 0 0 1px rgba(22,104,220,.15), 0 4px 14px rgba(22,104,220,.08); }
  .live-badge { font-size:10px; font-weight:700; color:#dc2626; letter-spacing:.5px; animation:liveBlink 1.4s infinite; }
  @keyframes liveBlink { 0%,100% { opacity:1;} 50% { opacity:.35;} }
  .task-head { display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); background:linear-gradient(180deg,#f8fafc,#ffffff); }
  .t-id { font-family:var(--mono); font-size:12px; color:var(--dim); }
  .t-input { font-size:13.5px; flex:1; min-width:200px; }
  .t-time { font-size:11px; color:var(--dim); font-family:var(--mono); }
  .st { display:inline-flex; align-items:center; gap:5px; padding:3px 12px; border-radius:14px; font-size:12px; font-weight:600; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .st.done { background:rgba(22,163,74,.1); color:#15803d; }
  .st.running,.st.executing,.st.committing { background:rgba(22,104,220,.1); color:#1d4ed8; }
  .st.awaiting_approval,.st.awaiting_commit,.st.awaiting_selection { background:rgba(217,119,6,.1); color:#b45309; }
  .st.failed { background:rgba(220,38,38,.1); color:#b91c1c; }
  .st.cancelled { background:rgba(100,116,139,.12); color:var(--muted); }
  .st.pending { background:rgba(100,116,139,.12); color:var(--muted); }
  .task-body { padding:12px 16px; }
  .plan { background:rgba(217,119,6,.08); border:1px solid rgba(217,119,6,.28); border-radius:8px;
    padding:10px 12px; font-size:13px; color:#92400e; margin-bottom:10px; }
  .steps { font-size:12px; color:var(--muted); padding:2px 0; font-family:var(--mono); }
  .steps.ok { color:var(--green); }
  .steps.err { color:var(--red); }
  .steps.running { color:var(--blue); }
  .step-block { background:#f1f5f9; border-radius:8px; padding:8px 12px; margin-top:10px;
    border-left:2px solid var(--accent); }
  /* 实时任务分解时间线 */
  .tl-block { margin-top:10px; background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .tl-head { font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.5px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .tl-count { font-family:var(--mono); font-size:11px; background:rgba(22,104,220,.1); color:#1d4ed8; padding:1px 8px; border-radius:10px; }
  .tl-node { display:flex; gap:8px; position:relative; padding-bottom:8px; }
  .tl-node::before { content:""; position:absolute; left:9px; top:20px; bottom:0; width:2px; background:var(--border2); }
  .tl-node:last-child::before { display:none; }
  .tl-dot { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; margin-top:2px; background:#e2e8f0; color:var(--muted); }
  .tl-dot.ok { background:rgba(22,163,74,.15); }
  .tl-dot.err { background:rgba(220,38,38,.15); }
  .tl-dot.running { background:rgba(22,104,220,.15); }
  .tl-dot.pulse { animation: tlPulse 1.2s infinite; }
  @keyframes tlPulse { 0%,100% { box-shadow:0 0 0 0 rgba(22,104,220,.35);} 50% { box-shadow:0 0 0 5px rgba(22,104,220,0);} }
  .tl-card { flex:1; font-size:12.5px; }
  .tl-tool { font-family:var(--mono); font-weight:600; color:var(--text); }
  .tl-tool .tl-ms { color:var(--dim); font-weight:400; font-size:11px; }
  .tl-msg { color:var(--muted); font-size:12px; margin-top:2px; word-break:break-all; }
  .tl-cur { background:rgba(22,104,220,.06); border-radius:6px; padding:2px 8px; }
  .tl-dec .tl-dot { background:var(--accent); color:#fff; }
  .err { color:var(--red); font-size:13px; }
  .empty { color:var(--dim); font-size:13px; padding:10px 0; }
  .reco { background:rgba(34,197,94,.08); border:1px solid rgba(34,197,94,.32); border-left:3px solid var(--green); border-radius:8px; padding:11px 13px; margin:8px 0; font-size:13.5px; color:#0f6e56; line-height:1.7; }
  .reco b { color:#0f6e56; }
  .grade { font-size:15px; font-weight:700; margin-bottom:8px; }
  .grade.bad { color:var(--red); } .grade.mid { color:var(--amber); } .grade.good { color:var(--green); }

  table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:7px 9px; border-bottom:1px solid var(--border);
    white-space:nowrap; font-size:11.5px; letter-spacing:.5px; }
  td { padding:7px 9px; border-bottom:1px solid var(--border); vertical-align:top; word-break:break-all; color:var(--text); }
  tr:hover td { background:rgba(15,23,42,.02); }
  .kv { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .tool-tag { display:inline-block; font-family:var(--mono); font-size:11px; background:rgba(22,104,220,.08);
    color:#1d4ed8; border:1px solid rgba(22,104,220,.22); padding:2px 9px; border-radius:6px; margin:4px 6px 0 0; }
  .trouble { display:none; margin-bottom:14px; padding:12px 16px; background:#fff; border:1px solid var(--border);
    border-radius:12px; font-size:12.5px; line-height:1.9; color:var(--muted); }
  .trouble b { color:var(--red); }
  .modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.4); backdrop-filter:blur(4px); z-index:999;
    display:flex; align-items:center; justify-content:center; }
  .modal-box { background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 26px;
    max-width:680px; width:92%; max-height:82vh; overflow:auto; box-shadow:0 24px 80px rgba(15,23,42,.25); }
  .modal-box h2 { font-size:16px; margin-bottom:14px; }
  .modal-box code { background:var(--panel-bg); padding:2px 7px; border-radius:5px; font-size:12px; color:var(--accent); }
  .foot { text-align:center; color:var(--dim); font-size:11px; padding:20px 0 10px; letter-spacing:1px; }
  @media (max-width:720px) { .topbar{padding:10px 14px} .wrap{padding:14px} .cmd-row{flex-direction:column} .cmd .btn{padding:12px} }
</style>
</head>
<body>

<noscript>
  <div style="position:fixed;inset:0;background:#fff;color:#b91c1c;padding:30px;font-size:15px;line-height:1.8;z-index:9999">
    <h2>⚠️ 浏览器禁用了 JavaScript</h2>
    <p>控制台所有交互（含自然语言输入、LLM 选择、飞书下发）都需要 JS。请在浏览器地址栏打开 DevTools → Settings → 启用 JavaScript，然后刷新本页。</p>
  </div>
</noscript>

<!-- 数据状态条：固定顶部中央大字，永远可见（即使开了 DevTools 也不被遮挡），染色分明 -->
<div id="liveBadge" style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;font-size:13px;font-weight:600;
  padding:6px 16px;border-radius:0 0 10px 10px;background:rgba(34,197,94,.95);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);
  font-family:var(--mono,monospace);min-width:280px;text-align:center;letter-spacing:.3px;">
  <span id="liveDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:7px;vertical-align:middle;box-shadow:0 0 4px #fff;"></span>
  <span id="liveTxt">⏳ 初始化（首次加载）...</span>
  <span id="liveBack" style="margin-left:10px;font-size:11px;opacity:.85"></span>
</div>

<div class="topbar">
  <div class="brand">
    <img class="logo" src="assets/agent-logo.png" alt="agent logo">
    <div>
      <h1>Palo Alto Networks&nbsp;防火墙监控运维数字员工</h1>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="top-ctrl">
    <button class="btn" onclick="showLLMConfig()">⚙️ 模型配置</button>
    <!-- 网络诊断条（后端地址 + 强刷 + 测网络），与模型配置同一行 -->
    <span id="diagBar" style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
      background:rgba(255,255,255,.92);border:1px solid var(--border2);border-radius:8px;padding:3px 8px;
      font-family:var(--mono,monospace);white-space:nowrap;">
      <span style="color:var(--muted)">后端→</span><code id="backendUrl" style="color:var(--accent)">http://localhost:8080</code>
      <button class="btn" style="padding:2px 8px;font-size:11px" onclick="location.reload(true)">🔄 强刷</button>
      <button class="btn" style="padding:2px 8px;font-size:11px" onclick="testBackend()">🩺 测网络</button>
    </span>
  </div>
</div>

<div class="wrap">

  <!-- KPI 概览卡（loadOverview 用 getElementById 找这些 ID） -->
  <div class="kpis">
    <div class="kpi" id="kpiDevice"><div class="label">🖥️ 设备</div><div class="value">--</div><div class="extra">--</div></div>
    <div class="kpi" id="kpiHa"><div class="label">🔁 HA 高可用</div><div class="value">--</div><div class="extra">PA 高可用对</div></div>
    <div class="kpi" id="kpiSession"><div class="label">🔌 活跃会话</div><div class="value">--</div><div class="bar"><i></i></div><div class="extra">--</div></div>
    <div class="kpi" id="kpiResource"><div class="label">📊 负载 / 内存</div><div class="value">--</div><div class="extra">--</div></div>
    <div class="kpi" id="kpiLicense"><div class="label">📜 许可证</div><div class="value">--</div><div class="extra">--</div></div>
  </div>

  <!-- 飞书集成面板 -->
  <div class="panel">
    <div class="panel-head">
      <h2>💬 飞书集成</h2>
      <span class="pill"><span class="dot green" id="fsDot"></span><span id="fsTxt">飞书检测中</span></span>
      <span class="meta" id="feishuStatus">检测中...</span>
    </div>
    <div class="panel-body">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input class="input" id="feishuMsg" placeholder="输入要发送到飞书群的消息..." style="flex:1">
        <button class="btn primary" onclick="feishuSend()">发送</button>
        <button class="btn" onclick="feishuPushReport()">推送最新巡检报告</button>
      </div>
      <div id="feishuResult" class="empty"></div>
    </div>
  </div>

  <!-- 自然语言命令框 -->
  <div class="panel">
    <div class="panel-head">
      <h2>⚡ 任务命令中心 <span style="color:var(--muted);font-weight:400;font-size:12.5px">（用自然语言提示词来发起命令）</span></h2>
      <!-- 当前 LLM 实时指示器：与下拉保持同步，hover 提示说明 -->
      <span id="currentLLMChip" title="当前 LLM（新提交的任务会由它处理）" style="display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:14px;font-size:11.5px;font-weight:600;border:1px solid var(--border2);background:#fff;color:var(--muted);cursor:pointer" onclick="showLLMConfig()">当前 ➜ 🟦 — </span>
    </div>
    <div class="panel-body">
      <div class="cmd">
        <div class="cmd-box">
          <textarea id="q" rows="3" placeholder="下达任务：设备状态 / 完整巡检 / 流量日志 / 谁在10分钟前修改了策略 / 192.168.1.2 不能访问外网 / 创建地址对象 x=10.0.0.0/24 / 封禁 1.2.3.4 …（Shift+Enter 换行）"
            oninput="autoGrow(this)"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit()}"></textarea>
          <div class="cmd-box-foot">
            <select class="select" id="fwSel" style="display:none"></select>
            <select class="select" id="llmSel">
              <option value="deepseek">DeepSeek（默认）</option>
            </select>
            <button class="btn primary" id="submitBtn" onclick="submit()" title="执行（⌘/Ctrl+Enter）">📤 执行</button>
          </div>
        </div>
        <div class="chips" id="btns"></div>
        <div class="trouble" id="troublePanel"></div>
      </div>
      <div id="out"></div>
    </div>
  </div>

  <!-- 任务中心 -->
  <div class="panel">
    <div class="panel-head">
      <h2>🎯 任务实时分析和结果展示 <span style="display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:11.5px;font-weight:600;color:var(--accent);background:rgba(22,104,220,.1);padding:3px 10px;border-radius:12px;border:1px solid rgba(22,104,220,.3);vertical-align:middle"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:liveBlink 1.4s infinite"></span>⏱ 实时</span></h2>
      <button class="btn" onclick="cleanAndRefresh()" style="padding:5px 12px">🧹 清除已完成并刷新</button>
    </div>
    <div class="panel-body" id="tasks"><div class="empty">暂无任务</div></div>
  </div>

  <div class="foot">Palo Alto Networks · PAN-OS 安全运维监控 · 数字员工平台</div>
</div>

<script>
// ── 全局错误捕获：任何 JS 异常都不让页面僵死，必须在状态条告知 ──
window.addEventListener("error", (ev) => {
  console.error("[page-error]", ev.error || ev.message);
  const txt = document.getElementById("liveTxt");
  if (txt) txt.textContent = "❌ JS 异常: " + (ev.message || ev.error || "?");
  pulseLiveBadge("err");
});
window.addEventListener("unhandledrejection", (ev) => {
  console.error("[page-rejection]", ev.reason);
  const txt = document.getElementById("liveTxt");
  if (txt) txt.textContent = "❌ 异步异常: " + (ev.reason && ev.reason.message || ev.reason || "?");
  pulseLiveBadge("err");
});
const _loc = location.origin || (location.protocol + "//" + location.host);

// ── 网络诊断：点击 [🩺 测网络] 按钮会并行 ping 4 个核心接口，结果打到 heartbeat + console ──
async function testBackend() {
  const txt = document.getElementById("liveTxt"); const back = document.getElementById("liveBack");
  pulseLiveBadge("warn"); if (txt) txt.textContent = "⏳ 诊断网络…"; if (back) back.textContent = "";
  const endpoints = ["/api/overview", "/api/llm", "/api/tasks", "/api/feishu/status"];
  const results = [];
  for (const ep of endpoints) {
    const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 3000);
    const t0 = Date.now();
    try {
      const r = await fetch(_loc + ep, { cache: "no-store", signal: ac.signal });
      clearTimeout(tm);
      const ms = Date.now() - t0;
      results.push((r.ok ? "✓" : "✗") + " " + ep + " " + r.status + " " + ms + "ms");
      console.log("[diag]", ep, r.status, ms + "ms");
    } catch (e) {
      clearTimeout(tm);
      results.push("✗ " + ep + " " + e.name + ": " + (e.message || ""));
      console.error("[diag]", ep, e.name, e.message);
    }
  }
  if (back) back.textContent = " | " + results.map(s => s.split(" ").slice(0, 2).join(" ")).join(" / ");
  const okCount = results.filter(r => r.startsWith("✓")).length;
  if (okCount === 0) { pulseLiveBadge("err"); if (txt) txt.textContent = "❌ 4 个接口全失败。浏览器无法访问 " + _loc + "（可能：服务挂了 / 网络代理阻断 / 跨域）"; console.error("[diag] ALL FAIL", results); }
  else if (okCount < 4) { pulseLiveBadge("warn"); if (txt) txt.textContent = "⚠️ " + okCount + "/4 接口可达：" + results.join("；"); }
  else { pulseLiveBadge("ok"); if (txt) txt.textContent = "✅ 4/4 接口正常 · 网络通"; }
}
window.testBackend = testBackend;

// ── 数据心跳：每个 fetcher 都打点，超时无心跳在状态条红色告警 ──
let _lastBeat = Date.now();
function beat() { _lastBeat = Date.now(); const txt=document.getElementById("liveTxt"); if(txt) txt.textContent="数据流: 正常 (" + new Date().toLocaleTimeString() + ")"; pulseLiveBadge("ok"); }
function pulseLiveBadge(state) {
  const b=document.getElementById("liveBadge"), d=document.getElementById("liveDot"), t=document.getElementById("liveTxt");
  if(!b||!d||!t) return;
  if (state === "warn") { b.style.background="rgba(217,119,6,.14)"; b.style.color="#b45309"; b.style.borderColor="rgba(217,119,6,.4)"; d.style.background="#d97706"; }
  else if (state === "err") { b.style.background="rgba(220,38,38,.14)"; b.style.color="#b91c1c"; b.style.borderColor="rgba(220,38,38,.4)"; d.style.background="#dc2626"; }
  else { b.style.background="rgba(34,197,94,.12)"; b.style.color="#15803d"; b.style.borderColor="rgba(34,197,94,.3)"; d.style.background="#22c55e"; }
}
setInterval(() => {
  const age = Date.now() - _lastBeat;
  if (age > 30000) { pulseLiveBadge("err"); document.getElementById("liveTxt").textContent = "数据流: " + Math.round(age/1000) + "s 无更新"; }
  else if (age > 8000) { pulseLiveBadge("warn"); }
}, 3000);

// fetch 加强：5 秒超时（避免某一个 endpoint 卡死让整个 init 僵掉）
async function fjs(url, opts) { opts = opts || {}; opts.timeout = opts.timeout || 5000;
  const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), opts.timeout);
  try { const r = await fetch(url, Object.assign({}, opts, { signal: ac.signal, cache: "no-store" })); if (!r.ok) throw new Error(url + " HTTP " + r.status); beat(); return await r.json(); }
  finally { clearTimeout(tm); }
}

let BTN_LABELS = {};

async function init() {
  pulseLiveBadge("warn");
  document.getElementById("liveTxt").textContent = "数据流: 初始化中…";
  // 容错三件套：每个 fetch 独立 try/catch，单个挂掉不影响整体渲染
  // 页面加载/刷新时先回到默认 LLM（llm-config.json 的 _default=deepseek），再读取当前状态显示。
  // 会话内手动切换（selectLLM）立即生效且不写盘；只有刷新/重新加载页面才回默认。
  const safe = async (label, fn) => { try { return await fn(); } catch (e) { console.warn("[init]", label, "失败:", e.message); return null; } };
  const [acts, fws, llm] = await Promise.all([
    safe("actions", () => fjs("/api/actions")),
    safe("firewalls", () => fjs("/api/firewalls")),
    safe("llm", async () => { await fjs("/api/llm/reset", { method: "POST" }); return await fjs("/api/llm"); }),
  ]);
  if (acts) BTN_LABELS = (acts && acts.actions) || {};
  renderQuickButtons();       // 即使 acts 失败也渲染空按钮（不会报错）
  renderFirewallSelect(fws || { firewalls: [] });
  renderLLMSelect(llm || { current: "deepseek", providers: {} });
  pollTasks();
  loadOverview();
  beat();
  // 兜底：3 个核心 endpoint 只要有一个失败就在状态条提示
  const fails = [acts, fws, llm].filter(x => !x).length;
  if (fails === 3) { pulseLiveBadge("err"); document.getElementById("liveTxt").textContent = "后端 3 个接口全失败，请检查服务 (PID 85320 → supervisor)"; }
  else if (fails > 0) { pulseLiveBadge("warn"); document.getElementById("liveTxt").textContent = "部分接口加载失败（已用兜底数据渲染）"; }
  else { document.getElementById("liveTxt").textContent = "数据流: " + new Date().toLocaleTimeString() + " 起正常运行"; }
}

async function submit() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const out = document.getElementById("out");
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  try {
    const r = await fetch("/api/task", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q, firewall: currentFirewall() })
    });
    const d = await r.json();
    if (d.error) {
      out.innerHTML = '<div class="panel"><div class="panel-body"><div class="err">' + esc(d.error) + "</div></div></div>";
      setTimeout(() => { if (out.innerHTML.includes("err")) out.innerHTML = ""; }, 3000);
    } else if (d.status === "awaiting_approval") {
      out.innerHTML = '<div class="panel"><div class="panel-body"><div class="plan">⏳ 等待审批：' + esc(d.plan) + '</div>请在任务中心点击「批准」或「拒绝」</div></div>';
    } else {
      out.innerHTML = '<div class="panel"><div class="panel-body"><div class="empty">任务 #' + d.taskId + " 已提交，查看任务中心 ↓</div></div></div>";
      setTimeout(() => { if (out.innerHTML.includes("已提交")) out.innerHTML = ""; }, 1500);
    }
    pollTasks();
  } catch (e) {
    out.innerHTML = '<div class="panel"><div class="panel-body"><div class="err">' + esc(e.message || e) + "</div></div></div>";
  } finally {
    btn.disabled = false;
  }
}

async function pollTasks() {
  let hadActive = false;
  try {
    const d = await fjs("/api/tasks", { timeout: 5000 });
    const tasks = d.tasks || [];
    const box = document.getElementById("tasks");
    if (!tasks.length) { box.innerHTML = '<div class="empty">暂无任务 · 从上方命令中心下达第一个任务</div>'; }
    else { box.innerHTML = tasks.slice(0, 20).map(renderTask).join(""); }
    hadActive = tasks.some((t) => ["pending", "running", "executing", "committing"].includes(t.status));
    // 实时任务分解：自动滚动到最新一条执行中任务的步骤（不打断用户主动滚动）
    if (hadActive) {
      const cur = tasks.find((t) => ["pending", "running", "executing", "committing"].includes(t.status));
      if (cur) {
        const el = document.getElementById("tl-" + cur.id);
        if (el && el.scrollIntoView && !document.body.dataset.paused) {
          el.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }
    }
  } catch (e) { document.getElementById("tasks").innerHTML = '<div class="empty">任务列表加载失败：' + esc(e.message || String(e)) + '</div>'; pulseLiveBadge("err"); }
  // 后台无条件持续轮询——修复"全部任务终态后页面僵死"问题。节奏：活跃 3s，idle 5s。
  setTimeout(pollTasks, hadActive ? 3000 : 5000);
}

// 清除终态任务（done/cancelled/failed），只保留活跃与待审批任务，然后刷新列表
async function cleanAndRefresh() {
  try {
    const r = await fetch("/api/tasks/clean", { method: "POST" });
    const d = await r.json();
    if (d.removed > 0) {
      const box = document.getElementById("tasks");
      box.innerHTML = '<div class="empty" style="color:var(--green)">🧹 已清除 ' + d.removed + ' 条已完成/已取消任务，保留 ' + d.remain + ' 条活跃任务</div>';
      setTimeout(pollTasks, 600);
    } else {
      pollTasks();
    }
  } catch (e) {
    pollTasks();
    document.getElementById("tasks").innerHTML = '<div class="empty">清除失败：' + esc(e.message || String(e)) + '</div>';
  }
}

function renderTask(t) {
  // LLM 标签：显示该任务被处理时使用的 LLM（≠当前下拉选中，那是"下一次任务"用的）
  const LLM_TAG = { deepseek: { c: "#1d4ed8", b: "rgba(29,78,216,.1)", label: "DeepSeek", icon: "🟦" }, qwen: { c: "#c2410c", b: "rgba(194,65,12,.1)", label: "通义千问", icon: "🟧" }, kimi: { c: "#6d28d9", b: "rgba(109,40,217,.1)", label: "Kimi", icon: "🟪" } };
  const llm = LLM_TAG[t.llm];
  const llmTag = llm ? '<span title="📌 历史记录：该任务创建/处理时使用的 LLM。最新任务会用当前选中（见命令中心右上的 🟦DeepSeek/🟧Qwen/🟪Kimi 标记）。" style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;background:' + llm.b + ';color:' + llm.c + '">' + llm.icon + ' 历史: ' + llm.label + '</span>' : "";
  let h = '<div class="task' + (["pending", "running", "executing", "committing"].includes(t.status) ? " live" : "") + '"><div class="task-head"><span class="t-id">#' + t.id + '</span><span class="st ' + t.status + '">' + statusText(t.status) + '</span>' + (["pending", "running", "executing", "committing"].includes(t.status) ? '<span class="live-badge">🔴 LIVE</span>' : "") + '<span class="t-input">' + esc(t.input) + '</span>' + llmTag + '<span class="t-time">' + esc(t.createdAt || "") + "</span></div>";
  h += '<div class="task-body">';

  if (t.status === "awaiting_approval") {
    h += '<div class="plan">变更计划：' + esc(t.plan) + "</div>";
    h += '<button class="btn" style="background:var(--green);color:#04121a;border:none" onclick="act(' + t.id + ",'approve')\">批准执行</button> <button class='btn' style='background:var(--red);color:#fff;border-color:var(--red)' onclick=\"act(" + t.id + ",'reject')\">拒绝</button>";
  } else if (t.status === "awaiting_selection") {
    const r = t.result || {}; const matched = r.matched || [];
    h += '<div class="plan">' + esc(t.plan) + "</div>";
    if (matched.length) {
      h += '<div class="plan" style="color:var(--blue)">匹配到 ' + r.totalMatches + ' 条，勾选要执行的策略（支持多选）：</div>';
      h += '<div style="margin:8px 0;display:flex;gap:8px;align-items:center">';
      h += '<button class="btn" style="font-size:12px" onclick="toggleAllCand(' + t.id + ')">全选/取消全选</button>';
      h += '<button class="btn" id="execMultiBtn' + t.id + '" style="background:var(--green);color:#04121a;border:none" onclick="execMulti(' + t.id + ')" disabled>执行所选 (0)</button>';
      h += '<span id="selCount' + t.id + '" style="font-size:12px;color:var(--muted)">未选择</span>';
      h += '</div>';
      h += '<div id="candList' + t.id + '" style="max-height:320px;overflow-y:auto;margin:8px 0">';
      for (let i = 0; i < matched.length; i++) {
        const m = matched[i];
        const cbId = 'cb_' + t.id + '_' + i;
        h += '<label style="display:block;padding:6px 10px;margin:3px 0;background:#f8fafc;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12.5px;transition:background .15s" onmouseover="this.style.background=\'#f1f5f9\'" onmouseout="this.style.background=\'#f8fafc\'">';
        h += '<input type="checkbox" id="' + cbId + '" value="' + esc(m) + '" onchange="updateSelCount(' + t.id + ')" style="margin-right:8px;cursor:pointer">';
        h += esc(m);
        h += '</label>';
      }
      h += '</div>';
    } else {
      h += '<div class="err">无匹配规则。请换个关键词或直接说"删除 &lt;精确名&gt;"</div>';
    }
    h += ' <button class="btn" style="background:var(--red);color:#fff;border-color:var(--red)" onclick="act(' + t.id + ",'cancel')\">取消</button>";
  } else if (t.status === "awaiting_commit") {
    h += '<div class="plan">candidate 已就绪，确认 commit？</div>';
    h += '<button class="btn" style="background:var(--green);color:#04121a;border:none" onclick="act(' + t.id + ",'confirm')\">确认 commit</button> <button class='btn' onclick=\"act(" + t.id + ",'cancel')\">取消</button>";
  } else if (["pending", "running", "executing", "committing"].includes(t.status)) {
    h += '<button class="btn" style="float:right" onclick="act(' + t.id + ",'cancel')\">取消任务</button>";
  }

  if (t.status === "done" && t.type === "query" && t.result) {
    if (t.result.summary) {
      // LLM 语义匹配分析（绿色高亮"建议"风格，但用蓝色强调"分析结论"）
      h += '<div style="background:rgba(29,78,216,.06);border:1px solid rgba(29,78,216,.3);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;margin:8px 0;font-size:13.5px;color:#1d4ed8;line-height:1.7;white-space:pre-wrap;word-break:break-word"><b>🎯 匹配分析（基于你的问句）：</b>' + esc(t.result.summary) + '</div>';
    }
    h += '<div style="font-size:11.5px;color:var(--muted);margin:6px 0 4px">📋 原始数据（工具调用结果）</div>';
    h += renderResult(t.result.results);
  } else if (t.status === "done" && t.type === "chat" && t.result) {
    // 自由问答兜底：LLM 分析/推理后的回答（紫色系强调"AI 思考"）
    h += '<div style="background:rgba(109,40,217,.05);border:1px solid rgba(109,40,217,.28);border-left:3px solid #6d28d9;border-radius:8px;padding:12px 14px;margin:8px 0;font-size:13.5px;color:#3c3489;line-height:1.75;white-space:pre-wrap;word-break:break-word">' + esc(t.result.answer || "") + '</div>';
  } else if (t.status === "done" && t.type === "inspect" && t.result) {
    h += '<div class="grade ' + (t.result.rate >= 75 ? (t.result.rate >= 90 ? "good" : "mid") : "bad") + '">评级 ' + esc(t.result.grade) + "（" + t.result.rate + "%）</div>";
    h += '<table><tr><th>检查项</th><th>结果</th></tr>' + (t.result.checks || []).map(c => "<tr><td>" + esc(c.name) + "</td><td>" + (c.pass ? "✅ 通过" : "❌ 不通过") + "</td></tr>").join("") + "</table>";
  } else if (t.status === "done" && t.type === "audit" && t.result) {
    h += '<div class="grade" style="font-size:14px">' + esc(t.result.title || "配置变更审计") + " · 共 " + t.result.total + " 条</div>";
    if (t.result.rows && t.result.rows.length) {
      h += "<table><tr><th>时间</th><th>操作人</th><th>命令</th><th>结果</th><th>来源</th><th>路径</th></tr>" +
        t.result.rows.slice(0, 50).map(r => "<tr><td>" + esc(r.time) + "</td><td>" + esc(r.admin) + "</td><td>" + esc(r.cmd) + "</td><td>" + esc(r.result) + "</td><td>" + esc(r.client) + "</td><td style='font-size:11px'>" + esc(r.path) + "</td></tr>").join("") +
        "</table>";
    } else {
      h += '<div class="empty">该时间窗口内无符合条件的变更记录</div>';
    }
  } else if (t.status === "done" && t.type === "diag" && t.result) {
    h += '<div class="grade" style="font-size:14px">' + esc(t.result.title || "诊断报告") + "</div>";
    if (t.result.verdict) {
      const fallbackTag = t.result.confidence && String(t.result.confidence).includes("fallback") ? ' <span style="background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600">⚠️ fallback（LLM 超时）</span>' : "";
      h += '<div class="plan"><b>📌 根因：</b>' + esc(t.result.verdict) + "（置信度 " + esc(t.result.confidence || "-") + (t.result.confidenceReason ? " · " + esc(t.result.confidenceReason) : "") + "）" + fallbackTag + "</div>";
    }
    if (Array.isArray(t.result.evidence) && t.result.evidence.length) {
      h += '<div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px"><b>🔍 证据链：</b><ol style="margin:6px 0 0;padding-left:22px">' + t.result.evidence.map(function(e){return "<li style='margin:2px 0'>" + esc(e) + "</li>";}).join("") + "</ol></div>";
    }
    if (t.result.recommendation) {
      h += '<div class="reco"><b>🛠 建议：</b>' + esc(t.result.recommendation) + "</div>";
    }
    h += "<table><tr><th>排查步骤</th><th>结果</th></tr>" + (t.result.sections || []).map(s => "<tr><td>" + esc(s.step) + "</td><td>" + esc(s.result) + "</td></tr>").join("") + "</table>";
  } else if (t.status === "done" && t.type === "change" && t.result) {
    h += '<div class="steps ok">✅ ' + esc(t.result.detail || "变更完成") + "</div>";
  } else if (t.status === "failed") {
    h += '<div class="err">' + esc(t.error || "失败") + "</div>";
  }

  if (t.steps && t.steps.length) {
    // 实时任务分解时间线：每步一个节点，当前执行步骤高亮，展示意图→计划→工具调用的完整链路
    const total = t.steps.length;
    const runningIdx = t.steps.findIndex(s => typeof s === "object" && s.status === "running");
    const stepHtml = t.steps.map((s, i) => {
      if (typeof s === "string") {
        // 意图/计划节点（LLM 决策、变更计划等）
        const isDecision = /LLM 规划|关键词匹配|变更计划|诊断类型|匹配到|已生成/.test(s);
        return '<div class="tl-node tl-dec' + (isDecision ? "" : "") + '"><span class="tl-dot" style="background:var(--accent)"></span><div class="tl-card"><span class="tl-msg">' + esc(s) + "</span></div></div>";
      }
      const icon = s.status === "running" ? "⏳" : s.status === "ok" ? "✅" : s.status === "err" ? "❌" : "·";
      const cls = s.status === "ok" ? "ok" : s.status === "err" ? "err" : s.status === "running" ? "running" : "";
      const isCur = i === runningIdx;
      return '<div class="tl-node"><span class="tl-dot ' + cls + (isCur ? " pulse" : "") + '">' + icon + '</span><div class="tl-card ' + (isCur ? "tl-cur" : "") + '"><div class="tl-tool">' + (isCur ? "▶ " : "") + esc(s.tool || "") + (s.ms ? ' <span class="tl-ms">' + s.ms + "ms</span>" : "") + '</div>' + (s.msg ? '<div class="tl-msg">' + esc(s.msg) + "</div>" : "") + "</div></div>";
    }).join("");
    h += '<div class="tl-block" id="tl-' + t.id + '"><div class="tl-head">🔧 实时任务分解 <span class="tl-count">' + (runningIdx >= 0 ? (runningIdx + 1) + "/" + total : total + " 步") + '</span></div>' + stepHtml + "</div>";
  }
  return h + "</div></div>";
}

function statusText(s) {
  const m = { pending: "排队中", running: "执行中", executing: "执行中", committing: "提交中", awaiting_approval: "待审批", awaiting_selection: "待选择", awaiting_commit: "待确认", done: "完成", failed: "失败", cancelled: "已取消" };
  return m[s] || s;
}

async function act(id, action, arg) {
  const url = "/api/task/" + id + "/" + action + (arg ? "/" + encodeURIComponent(arg) : "");
  try { await fetch(url, { method: "POST" }); } catch (e) {}
  pollTasks();
}

// 多选批量执行：从 checkbox 收集已选 name，POST JSON body
async function execMulti(taskId) {
  const container = document.getElementById('candList' + taskId);
  if (!container) return;
  const checked = container.querySelectorAll('input[type=checkbox]:checked');
  const names = Array.from(checked).map(c => c.value);
  if (!names.length) { alert('请先勾选要执行的策略'); return; }
  if (!confirm('确认批量执行 ' + names.length + ' 个操作？\n' + names.join('\n'))) return;
  try {
    await fetch('/api/task/' + taskId + '/select-multi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ names })
    });
  } catch (e) {}
  pollTasks();
}

// 全选/取消全选
function toggleAllCand(taskId) {
  const container = document.getElementById('candList' + taskId);
  if (!container) return;
  const boxes = container.querySelectorAll('input[type=checkbox]');
  const allChecked = Array.from(boxes).every(c => c.checked);
  boxes.forEach(c => { c.checked = !allChecked; });
  updateSelCount(taskId);
}

// 更新已选数量显示和执行按钮状态
function updateSelCount(taskId) {
  const container = document.getElementById('candList' + taskId);
  const countEl = document.getElementById('selCount' + taskId);
  const btn = document.getElementById('execMultiBtn' + taskId);
  if (!container) return;
  const n = container.querySelectorAll('input[type=checkbox]:checked').length;
  if (countEl) countEl.textContent = n ? '已选 ' + n + ' 条' : '未选择';
  if (btn) {
    btn.disabled = n === 0;
    btn.textContent = n ? '执行所选 (' + n + ')' : '执行所选 (0)';
  }
}

function renderResult(results) {
  let h = "";
  (results || []).forEach(res => {
    h += '<div class="tool-tag">' + esc(res.tool) + "</div>";
    if (res.error) { h += '<div class="err">' + esc(res.error) + "</div>"; return; }
    h += renderData(res.data);
  });
  return h;
}

function renderData(d) {
  if (d == null) return '<div class="empty">无数据</div>';
  if (typeof d === "string") return '<div class="kv">' + esc(d.slice(0, 600)) + "</div>";
  const arr = findArray(d);
  if (arr && arr.length > 0) return renderTable(arr);
  if (arr && arr.length === 0) return '<div class="empty">无数据（0 条）</div>';
  const flat = flattenObj(d);
  if (Object.keys(flat).length === 0) return '<div class="empty">无数据</div>';
  return renderKv(flat);
}

function findArray(o, depth) {
  depth = depth || 0;
  if (depth > 5) return null;
  if (Array.isArray(o)) return o;
  if (o && typeof o === "object") {
    for (const k of ["entry", "rules", "firewalls", "licenses"]) if (Array.isArray(o[k])) return o[k];
    for (const v of Object.values(o)) { const r = findArray(v, depth + 1); if (r && r.length) return r; }
  }
  return null;
}

function flattenObj(o, prefix, out) {
  prefix = prefix || "";
  out = out || {};
  for (const [k, v] of Object.entries(o || {})) {
    if (v == null || v === "") continue;
    if (typeof v === "object") flattenObj(v, prefix + k + ".", out);
    else out[prefix + k] = String(v);
  }
  return out;
}

function renderTable(rows) {
  let keys = [];
  rows.forEach(r => Object.keys(flattenObj(r)).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  if (keys.length > 12) {
    const PRIORITY = ["receive_time","time","time_generated","create_time","high_res_timestamp","src","source","src_ip","sport","dport","dst","destination","dst_ip","app","application","proto","rule","action","severity","threat","threatid","subtype","category","from","to","inbound_if","outbound_if","name","@_name","hostname","model","sw-version","family","kbps","num-active","num-tcp","num-udp","num-installed","num-max","pps","eventid","opaque","serial","ip-address","uptime","rule_uuid","ip","value","type","status","enabled"];
    const ranked = PRIORITY.filter(k => keys.includes(k));
    const rest = keys.filter(k => !PRIORITY.includes(k)).slice(0, 8);
    keys = ranked.concat(rest).slice(0, 14);
  }
  let h = "<table><tr>" + keys.map(k => "<th>" + esc(k) + "</th>").join("") + "</tr>";
  rows.slice(0, 50).forEach(r => {
    const flat = flattenObj(r);
    h += "<tr>" + keys.map(k => "<td>" + esc(flat[k] || "") + "</td>").join("") + "</tr>";
  });
  return h + "</table>" + (rows.length > 50 ? '<div class="empty">仅显示前 50 条 / 共 ' + rows.length + " 条</div>" : "");
}

function renderKv(kv) {
  let h = "<table>";
  Object.entries(kv).forEach(([k, v]) => {
    const sv = String(v);
    if (k === "raw" && sv.length > 200) {
      h += "<tr><th>raw</th><td class='kv'>[折叠 " + Math.round(sv.length / 1024) + "KB 原始数据]</td></tr>";
    } else {
      h += "<tr><th>" + esc(k) + "</th><td class='kv'>" + esc(sv.length > 300 ? sv.slice(0, 300) + "..." : sv) + "</td></tr>";
    }
  });
  return h + "</table>";
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

async function loadFeishuStatus() {
  try {
    const d = await fjs("/api/feishu/status", { timeout: 4000 });
    const dot = document.getElementById("fsDot");
    dot.className = "dot " + (d.running ? "green" : "red");
    document.getElementById("fsTxt").textContent = d.running ? "飞书在线" : "飞书离线";
    document.getElementById("feishuStatus").textContent = (d.running ? "🟢 轮询 daemon 运行中 · 群: " : "🔴 轮询 daemon 未运行 · 群: ") + esc(d.chat || "-");
  } catch (e) {
    document.getElementById("fsTxt").textContent = "飞书加载失败";
    document.getElementById("feishuStatus").textContent = "🔴 接口异常: " + esc(e.message || String(e));
    pulseLiveBadge("err");
  }
  // 飞书状态每 5s 轮询一次（之前只查一次，daemon 异常 UI 不会刷新）
  setTimeout(loadFeishuStatus, 5000);
}

async function feishuSend() {
  const text = document.getElementById("feishuMsg").value.trim();
  if (!text) return;
  const out = document.getElementById("feishuResult");
  out.innerHTML = "发送中...";
  try {
    const r = await fetch("/api/feishu/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    const d = await r.json();
    out.innerHTML = d.ok ? '<span style="color:var(--green)">✅ 已发送' + (d.data ? " (msg " + esc(d.data) + ")" : "") + "</span>" : '<span class="err">❌ ' + esc(d.error || "发送失败") + "</span>";
  } catch (e) { out.innerHTML = '<span class="err">❌ ' + esc(e.message) + "</span>"; }
}

async function feishuPushReport() {
  const out = document.getElementById("feishuResult");
  out.innerHTML = "推送中...";
  try {
    const r = await fetch("/api/feishu/push-report", { method: "POST" });
    const d = await r.json();
    out.innerHTML = d.ok ? '<span style="color:var(--green)">✅ 已推送最新报告</span>' : '<span class="err">❌ ' + esc(d.error || "推送失败") + "</span>";
  } catch (e) { out.innerHTML = '<span class="err">❌ ' + esc(e.message) + "</span>"; }
}

loadFeishuStatus();
init();
</script>
